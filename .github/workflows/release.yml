name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (DMG & APK)
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Create artifacts staging directory
      - name: Prepare Artifacts Directory
        run: mkdir -p ./artifacts

      # ----------------------------------------------------
      # Android Build Step
      # ----------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Android Release APK
        working-directory: android-client
        run: |
          echo "Building Android release APK non-interactively..."
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          
          # Copy to artifacts directory
          cp app/build/outputs/apk/release/*.apk ../artifacts/AetherLink-Android.apk
          if [ -n "${{ github.ref_name }}" ]; then
            cp ../artifacts/AetherLink-Android.apk ../artifacts/AetherLink-${{ github.ref_name }}.apk || true
          fi
          ls -lh ../artifacts/

      # ----------------------------------------------------
      # macOS Build & DMG Step
      # ----------------------------------------------------
      - name: Build macOS App & Create DMG
        working-directory: macos-client
        run: |
          echo "Building macOS binary using Swift tools..."
          swift build -c release
          
          # Assemble .app bundle
          mkdir -p AetherLink.app/Contents/MacOS
          mkdir -p AetherLink.app/Contents/Resources
          
          cp .build/release/AetherLink AetherLink.app/Contents/MacOS/AetherLink
          cp Info.plist AetherLink.app/Contents/Info.plist
          
          if [ -d "Resources" ]; then
            cp -R Resources/* AetherLink.app/Contents/Resources/ 2>/dev/null || true
          fi
          
          # Ad-hoc sign bundle non-interactively (no keychain prompt)
          codesign --force --deep -s - AetherLink.app
          
          # Assemble clean DMG
          mkdir -p dmg_staging
          cp -R AetherLink.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          
          hdiutil create \
            -volname "AetherLink" \
            -srcfolder dmg_staging \
            -ov \
            -format UDZO \
            ../artifacts/AetherLink-macOS.dmg
          
          if [ -n "${{ github.ref_name }}" ]; then
            cp ../artifacts/AetherLink-macOS.dmg ../artifacts/AetherLink-${{ github.ref_name }}.dmg || true
          fi
          
          rm -rf dmg_staging
          ls -lh ../artifacts/

      # ----------------------------------------------------
      # Changelog Generation Step
      # ----------------------------------------------------
      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || "")
          CURRENT_TAG="${{ github.ref_name }}"
          if [ -z "$CURRENT_TAG" ]; then
            CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.3.6")
          fi
          
          if [ -z "$PREV_TAG" ]; then
            echo "## 🚀 İlk Sürüm Dağıtımı" > release_notes.md
            git log --pretty=format:"* %s (%h)" -n 15 >> release_notes.md
          else
            echo "## 🚀 Neler Yeni ($PREV_TAG → $CURRENT_TAG)" > release_notes.md
            echo "" >> release_notes.md
            git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)" --no-merges >> release_notes.md
          fi
          echo "" >> release_notes.md
          cat release_notes.md

      # ----------------------------------------------------
      # GitHub Release Step
      # ----------------------------------------------------
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.3.6")
          fi
          
          echo "Publishing release for tag: $TAG"
          
          # Check if release already exists on GitHub
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Updating release notes..."
            gh release edit "$TAG" --notes-file release_notes.md
            echo "Uploading artifacts with --clobber..."
            gh release upload "$TAG" ./artifacts/*.dmg ./artifacts/*.apk --clobber
          else
            echo "Creating new release $TAG on GitHub..."
            gh release create "$TAG" ./artifacts/*.dmg ./artifacts/*.apk --title "$TAG" --notes-file release_notes.md
          fi
          
          echo "GitHub Release $TAG published successfully!"
